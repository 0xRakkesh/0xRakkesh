name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Calculate random commits (0-10) and generate empty ones
        id: decision
        run: |
          LAST_UPDATE=$(git log -1 --format="%at" -- codeberg-snake-dark.svg 2>/dev/null)
          if [ -z "$LAST_UPDATE" ]; then LAST_UPDATE=0; fi
          NOW=$(date +%s)
          DAYS_SINCE=$(( (NOW - LAST_UPDATE) / 86400 ))
          
          # Roll a number between 0 and 99 to create a "weighted" probability
          CHANCE=$(( RANDOM % 100 ))
          
          if [ $CHANCE -lt 30 ]; then
            COMMITS=0                        # 30% chance for 0 commits
          elif [ $CHANCE -lt 70 ]; then
            COMMITS=$(( (RANDOM % 3) + 1 ))  # 40% chance for 1 to 3 commits (Normal)
          elif [ $CHANCE -lt 95 ]; then
            COMMITS=$(( (RANDOM % 4) + 4 ))  # 25% chance for 4 to 7 commits (Busy)
          else
            COMMITS=$(( (RANDOM % 3) + 8 ))  # 5% chance for 8 to 10 commits (Rare high level)
          fi
          
          # Safety net: If it's been 5 days and it rolled a 0, force a commit
          if [ "$DAYS_SINCE" -ge 5 ] && [ "$COMMITS" -eq 0 ]; then
            echo "5 days passed! Forcing at least 1 commit today."
            COMMITS=1
          fi
          
          echo "Target commits today: $COMMITS"
          echo "run_snake=$COMMITS" >> $GITHUB_ENV
          
          # If we are doing commits today, set up the bot and create empty commits
          if [ "$COMMITS" -gt 0 ]; then
            git config --global user.name 'github-actions[bot]'
            git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
            
            # Subtract 1 because the final snake file update counts as our final commit
            DUMMY_COMMITS=$(( COMMITS - 1 ))
            
            if [ "$DUMMY_COMMITS" -gt 0 ]; then
              for i in $(seq 1 $DUMMY_COMMITS); do
                git commit --allow-empty -m "chore: activity bump"
              done
              echo "Created $DUMMY_COMMITS empty commits."
            fi
          fi

      - name: Generate Codeberg dark snake
        if: env.run_snake != '0' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx generate-snake-animation@3 \
            --github_user 0xRakkesh \
            --output codeberg-snake-dark.svg?palette=codeberg-dark

      - uses: stefanzweifel/git-auto-commit-action@v5
        if: env.run_snake != '0' || github.event_name == 'workflow_dispatch'
        with:
          commit_message: "chore: update snake"
          file_pattern: codeberg-snake-dark.svg
